<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>二次元插画画廊 · 模板</title>
<style>
/* ============================================================
   基础
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:#08080f;color:#e9e9f4;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(140,150,255,.28);border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:rgba(140,150,255,.55);}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes rise{
  from{opacity:0;transform:translateY(20px);}
  to  {opacity:1;transform:translateY(0);}
}

/* ============================================================
   加载界面
   ============================================================ */
#loader{
  position:fixed;inset:0;z-index:999;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 38%,#1c1c2e 0%,#0a0a13 62%,#06060c 100%);
  transition:opacity .85s ease, visibility .85s ease;
}
#loader.done{opacity:0;visibility:hidden;pointer-events:none;}

.loader-inner{
  display:flex;flex-direction:column;align-items:center;
  gap:28px;width:min(440px,74vw);
}

/* —— 旋转插图（位于加载条上方） —— */
.loader-spinner{
  position:relative;width:138px;height:138px;
  display:grid;place-items:center;
}
.loader-illust{
  width:108px;height:108px;border-radius:50%;
  background-size:cover;background-position:center;
  background-color:#1e1e30;
  border:2px solid rgba(150,160,255,.55);
  box-shadow:0 0 34px rgba(112,122,255,.5), inset 0 0 22px rgba(0,0,0,.55);
  animation:spin 2.6s linear infinite;
}
.loader-ring{
  position:absolute;inset:0;border-radius:50%;
  border:2px dashed rgba(140,150,255,.32);
  animation:spin 7s linear infinite reverse;
}
.loader-ring::before{
  content:'';position:absolute;inset:-10px;border-radius:50%;
  border:2px solid transparent;
  border-top-color:rgba(196,108,255,.85);
  border-left-color:rgba(139,147,255,.35);
  animation:spin 1.8s linear infinite;
}

/* —— 加载条 —— */
.loader-bar{
  width:100%;height:7px;border-radius:99px;
  background:rgba(255,255,255,.07);
  box-shadow:inset 0 1px 4px rgba(0,0,0,.6);
  overflow:hidden;
}
.loader-bar-fill{
  height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#6c7cff,#b56cff,#ff6cc0);
  box-shadow:0 0 16px rgba(150,120,255,.85);
  transition:width .22s ease-out;
}
.loader-info{
  display:flex;justify-content:space-between;align-items:baseline;
  width:100%;font-size:12.5px;letter-spacing:.12em;color:#8b8bad;
}
.loader-info b{color:#c9ccff;font-weight:600;font-size:15px;}

/* ============================================================
   主界面
   ============================================================ */
#app{
  position:relative;
  height:100dvh;
  display:grid;
  grid-template-columns:minmax(0,1.85fr) minmax(300px,.82fr);
  gap:14px;padding:14px;
  background-image:var(--bg-img);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}
#app::before{
  content:'';position:absolute;inset:0;z-index:0;
  background:linear-gradient(180deg,rgba(8,8,16,.74),rgba(8,8,16,.9));
}
#app > *{position:relative;z-index:1;}

/* —— 面板通用 —— */
.panel{
  background:rgba(20,20,34,.66);
  border:1px solid rgba(255,255,255,.075);
  border-radius:16px;
  backdrop-filter:blur(14px) saturate(120%);
  -webkit-backdrop-filter:blur(14px) saturate(120%);
  box-shadow:0 10px 34px rgba(0,0,0,.38);
}
/* 入场动画 */
#app .panel{opacity:0;}
#app.ready .panel{animation:rise .68s cubic-bezier(.22,.85,.3,1) both;}

/* ============================================================
   左栏
   ============================================================ */
.left-col{
  display:flex;flex-direction:column;gap:14px;
  min-height:0;min-width:0;
}

/* —— 画廊（占主要画面） —— */
.gallery-panel{
  flex:1;min-height:0;display:flex;flex-direction:column;
  padding:16px 16px 14px;
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  flex:0 0 auto;margin-bottom:12px;
}
.panel-head h2{
  margin:0;font-size:15px;font-weight:600;letter-spacing:.07em;
  display:flex;align-items:center;gap:9px;
}
.panel-head h2::before{
  content:'';width:4px;height:16px;border-radius:2px;
  background:linear-gradient(180deg,#8b93ff,#c46cff);
  box-shadow:0 0 10px rgba(150,130,255,.75);
}
.panel-head .count{font-size:12px;color:#8a8aa8;letter-spacing:.06em;}

.gallery-scroll{flex:1;min-height:0;overflow-y:auto;padding-right:4px;}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(142px,1fr));
  gap:11px;
}
.gallery-item{
  position:relative;aspect-ratio:1/1;
  border-radius:11px;overflow:hidden;
  background-size:cover;background-position:center;
  background-color:#1c1c2e;
  border:1px solid rgba(255,255,255,.07);
  cursor:pointer;
  transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s,border-color .35s;
}
.gallery-item::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 52%,rgba(120,110,255,.32));
  opacity:0;transition:opacity .35s;
}
.gallery-item:hover{
  transform:translateY(-5px) scale(1.035);
  border-color:rgba(140,150,255,.62);
  box-shadow:0 14px 30px rgba(0,0,0,.55),0 0 0 1px rgba(140,150,255,.45);
  z-index:2;
}
.gallery-item:hover::after{opacity:1;}

/* —— 左栏底部：两个文字栏目 —— */
.bottom-row{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  flex:0 0 auto;
}
.text-block{padding:14px 16px;min-height:106px;}
.text-block h3{
  margin:0 0 8px;font-size:14px;font-weight:600;
  color:#c7c9ff;letter-spacing:.05em;
}
.text-block p{margin:0;font-size:13px;line-height:1.78;color:#a6a6c2;}

/* ============================================================
   右栏（从上往下 6 个栏目）
   ============================================================ */
.right-col{
  display:flex;flex-direction:column;gap:14px;
  min-height:0;min-width:0;
  overflow-y:auto;padding-right:4px;
}
.right-panel{flex:0 0 auto;padding:14px;}

.rp-title{
  margin:0 0 10px;font-size:13.5px;font-weight:600;letter-spacing:.06em;
  color:#d5d6f5;display:flex;align-items:center;gap:8px;
}
.rp-title::before{
  content:'';width:3px;height:13px;border-radius:2px;
  background:linear-gradient(180deg,#8b93ff,#c46cff);
  box-shadow:0 0 8px rgba(150,130,255,.8);
}

/* ① 16:9 大图 */
.feature-img{
  aspect-ratio:16/9;border-radius:10px;
  background-size:cover;background-position:center;
  background-color:#1c1c2e;
  border:1px solid rgba(255,255,255,.07);
  transition:transform .4s,box-shadow .4s;
}
.feature-img:hover{transform:scale(1.016);box-shadow:0 10px 26px rgba(0,0,0,.5);}

/* 文本 */
.rp-text{margin:0;font-size:12.5px;line-height:1.82;color:#a6a6c2;}

/* 标签 */
.tag-wrap{display:flex;flex-wrap:wrap;gap:7px;}
.tag{
  font-size:11.5px;padding:4px 10px;border-radius:99px;
  background:rgba(140,150,255,.12);
  border:1px solid rgba(140,150,255,.28);
  color:#b9bdf5;cursor:default;transition:.25s;
}
.tag:hover{background:rgba(140,150,255,.28);color:#fff;transform:translateY(-1px);}

/* 链接 */
.link-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
.link-list a{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12.5px;color:#a6a6c2;text-decoration:none;
  padding:6px 8px;border-radius:8px;transition:.25s;
}
.link-list a::after{content:'→';opacity:.32;transition:.25s;}
.link-list a:hover{background:rgba(140,150,255,.12);color:#dfe1ff;}
.link-list a:hover::after{opacity:1;transform:translateX(3px);}

/* ⑥ 3 列 × 2 行 的 1:1 图片 */
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.grid6 > div{
  aspect-ratio:1/1;border-radius:9px;
  background-size:cover;background-position:center;
  background-color:#1c1c2e;
  border:1px solid rgba(255,255,255,.07);
  cursor:pointer;transition:transform .3s,box-shadow .3s,border-color .3s;
}
.grid6 > div:hover{
  transform:scale(1.07);z-index:2;
  border-color:rgba(140,150,255,.6);
  box-shadow:0 8px 20px rgba(0,0,0,.5);
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:900px){
  html,body{overflow:auto;}
  #app{
    height:auto;min-height:100dvh;
    grid-template-columns:1fr;
  }
  .gallery-scroll{max-height:62vh;}
  .right-col{overflow:visible;}
  .bottom-row{grid-template-columns:1fr;}
}
@media (max-width:480px){
  .gallery-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
  #app{padding:10px;gap:10px;}
}
</style>
</head>
<body>

<!-- ================= 加载界面 ================= -->
<div id="loader">
  <div class="loader-inner">

    <!-- 加载条上方的旋转插图 -->
    <div class="loader-spinner">
      <div class="loader-ring"></div>
      <div class="loader-illust" id="loaderIllust"></div>
    </div>

    <!-- 加载条 -->
    <div class="loader-bar">
      <div class="loader-bar-fill" id="barFill"></div>
    </div>

    <div class="loader-info">
      <span>正在加载画廊…</span>
      <b><span id="loaderPercent">0</span>%</b>
    </div>

  </div>
</div>

<!-- ================= 主界面 ================= -->
<main id="app">

  <!-- 左栏 -->
  <section class="left-col">

    <!-- 各类图画展示（占多数画面） -->
    <div class="panel gallery-panel">
      <div class="panel-head">
        <h2>插画画廊</h2>
        <span class="count" id="galleryCount">0 张</span>
      </div>
      <div class="gallery-scroll">
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
    </div>

    <!-- 底部两个文字栏目 -->
    <div class="bottom-row" id="bottomRow"></div>

  </section>

  <!-- 右栏：从上往下 6 个栏目，由 JS 渲染 -->
  <aside class="right-col" id="rightCol"></aside>

</main>

<script>
/* ============================================================
   ★★★ 配置区：把下面的空字符串换成你自己的图片地址即可 ★★★
   ============================================================ */
const CONFIG = {

  /* ---------- 加载页 ---------- */
  loadingIllust: '',            // 加载时旋转的插图（建议 1:1 正方形）

  /* ---------- 主界面背景 ---------- */
  background: '',               // 建议 1920×1080 以上

  /* ---------- 左侧画廊图片（可放任意张，留空自动生成占位图） ---------- */
  gallery: [
    // 'img/1.jpg', 'img/2.jpg', 'img/3.jpg',
  ],

  /* ---------- 左侧底部：两个文字栏目 ---------- */
  textBlocks: [
    {
      title: '关于这个画廊',
      text: '这里是第一个文字栏目。你可以写画廊的介绍、创作理念，或者一段喜欢的台词。'
    },
    {
      title: '更新日志',
      text: '这里是第二个文字栏目。2024.01 新作品三张；2024.02 页面改版；2024.03 ……'
    }
  ],

  /* ---------- 右侧：从上往下 6 个栏目 ---------- */
  rightPanels: [

    /* ① 第一个栏目：16:9 图片 */
    {
      title: '精选作品',
      type: 'image16x9',
      image: ''                 // ← 16:9 图片地址
    },

    /* ② */
    {
      title: '最近动态',
      type: 'text',
      text: 'cprcsdjhsi。'
    },

    /* ③ */
    {
      title: '关于作者',
      type: 'text',
      text: '自由插画师，主攻二次元角色设计与场景插画，喜欢高饱和度的光影表现。'
    },

    /* ④ */
    {
      title: '标签分类',
      type: 'tags',
      tags: ['原创', '插画', '角色设计', '场景', '练习', 'Q版']
    },

    /* ⑤ */
    {
      title: '友情链接',
      type: 'links',
      links: ['Pixiv', 'Twitter / X', 'Bilibili', 'ArtStation']
    },

    /* ⑥ 第六个栏目：3 列 × 2 行，共 6 张 1:1 图片 */
    {
      title: '更多作品',
      type: 'grid6',
      images: []                // ← 放 6 个地址，不足会自动补占位图
    }
  ]
};

/* ============================================================
   占位图生成（没填图片时自动使用，纯 SVG，无需联网）
   ============================================================ */
const esc = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function PH(w, h, label){
  const fs = Math.max(12, Math.round(Math.min(w, h) / 7));
  const svg =
`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
<rect width="100%" height="100%" fill="#1e1e30"/>
<rect x="1" y="1" width="${w-2}" height="${h-2}" fill="none" stroke="#3a3a58" stroke-width="2"/>
<text x="50%" y="50%" font-family="sans-serif" font-size="${fs}"
fill="#7878a6" text-anchor="middle" dominant-baseline="middle">${esc(label)}</text>
</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ============================================================
   渲染
   ============================================================ */

/* ---------- 加载页插图 ---------- */
document.getElementById('loaderIllust').style.backgroundImage =
  `url("${CONFIG.loadingIllust || PH(240, 240, '插图')}")`;

/* ---------- 主界面背景 ---------- */
document.getElementById('app').style.setProperty(
  '--bg-img',
  `url("${CONFIG.background || PH(1600, 900, '主界面背景')}")`
);

/* ---------- 左侧画廊 ---------- */
(function renderGallery(){
  const grid = document.getElementById('galleryGrid');
  const list = (CONFIG.gallery && CONFIG.gallery.length)
    ? CONFIG.gallery
    : Array.from({ length: 12 }, (_, i) => PH(420, 420, '插图 ' + (i + 1)));

  list.forEach((src, i) => {
    const d = document.createElement('div');
    d.className = 'gallery-item';
    d.style.backgroundImage = `url("${src}")`;
    d.title = '插图 ' + (i + 1);
    grid.appendChild(d);
  });

  document.getElementById('galleryCount').textContent = list.length + ' 张';
})();

/* ---------- 左侧底部两个文字栏目 ---------- */
(function renderTextBlocks(){
  const row = document.getElementById('bottomRow');
  CONFIG.textBlocks.forEach(item => {
    const box = document.createElement('div');
    box.className = 'panel text-block';

    const h = document.createElement('h3');
    h.textContent = item.title || '';

    const p = document.createElement('p');
    p.textContent = item.text || '';

    box.append(h, p);
    row.appendChild(box);
  });
})();

/* ---------- 右侧 6 个栏目 ---------- */
(function renderRight(){
  const col = document.getElementById('rightCol');

  CONFIG.rightPanels.forEach(cfg => {
    const sec = document.createElement('section');
    sec.className = 'panel right-panel';

    if (cfg.title){
      const h = document.createElement('h3');
      h.className = 'rp-title';
      h.textContent = cfg.title;
      sec.appendChild(h);
    }

    switch (cfg.type){

      /* 16:9 图片 */
      case 'image16x9': {
        const img = document.createElement('div');
        img.className = 'feature-img';
        img.style.backgroundImage =
          `url("${cfg.image || PH(640, 360, '16 : 9')}")`;
        sec.appendChild(img);
        break;
      }

      /* 纯文本 */
      case 'text': {
        const p = document.createElement('p');
        p.className = 'rp-text';
        p.textContent = cfg.text || '';
        sec.appendChild(p);
        break;
      }

      /* 标签 */
      case 'tags': {
        const wrap = document.createElement('div');
        wrap.className = 'tag-wrap';
        (cfg.tags || []).forEach(t => {
          const s = document.createElement('span');
          s.className = 'tag';
          s.textContent = t;
          wrap.appendChild(s);
        });
        sec.appendChild(wrap);
        break;
      }

      /* 链接列表 */
      case 'links': {
        const ul = document.createElement('ul');
        ul.className = 'link-list';
        (cfg.links || []).forEach(t => {
          const li = document.createElement('li');
          const a  = document.createElement('a');
          a.href = '#';
          a.textContent = t;
          li.appendChild(a);
          ul.appendChild(li);
        });
        sec.appendChild(ul);
        break;
      }

      /* 3 列 × 2 行的 1:1 图片 */
      case 'grid6': {
        const g = document.createElement('div');
        g.className = 'grid6';

        const imgs = (cfg.images && cfg.images.length)
          ? cfg.images.slice(0, 6)
          : [];

        // 不足 6 张自动补占位图
        while (imgs.length < 6){
          imgs.push(PH(300, 300, '图 ' + (imgs.length + 1)));
        }

        imgs.forEach(src => {
          const d = document.createElement('div');
          d.style.backgroundImage = `url("${src}")`;
          g.appendChild(d);
        });

        sec.appendChild(g);
        break;
      }
    }

    col.appendChild(sec);
  });
})();

/* ============================================================
   加载动画控制
   ============================================================ */
(function boot(){
  const fill    = document.getElementById('barFill');
  const percent = document.getElementById('loaderPercent');
  const loader  = document.getElementById('loader');
  const app     = document.getElementById('app');

  let progress = 0;
  let finished = false;

  function paint(){
    fill.style.width = progress + '%';
    percent.textContent = Math.floor(progress);
  }

  // 模拟进度
  const tick = setInterval(() => {
    if (finished) return;
    progress = Math.min(progress + Math.random() * 7 + 1.2, 90);
    paint();
  }, 110);

  function finish(){
    if (finished) return;
    finished = true;
    clearInterval(tick);

    progress = 100;
    paint();

    setTimeout(() => {
      loader.classList.add('done');
      app.classList.add('ready');

      // 面板依次浮入
      document.querySelectorAll('#app .panel').forEach((p, i) => {
        p.style.animationDelay = (i * 0.06) + 's';
      });

      // 动画结束后清理
      setTimeout(() => { loader.remove(); }, 1000);
    }, 560);
  }

  // 预加载主背景，加载完成或超时后进入主界面
  if (CONFIG.background){
    const pre = new Image();
    pre.onload  = finish;
    pre.onerror = finish;
    pre.src = CONFIG.background;
    setTimeout(finish, 6000);   // 兜底超时
  } else {
    setTimeout(finish, 1500);   // 使用占位背景时走个过场
  }
})();
</script>
</body>
</html>
