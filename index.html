    <style>
        * {
            margin: 0;  
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #39c5bb;
            color: #114514;
            line-height: 1.7;
        }
        img{
            max-width：100%
            height：auto;
            dispaly：block;
        }
        /* 导航栏 */
        header {
            background: #2e8b8b;
            color: #fff;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 99;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            margin-left: 24px;
        }
        .nav-links a:hover {
            color: #42b983;
        }
        /* 主体容器 */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: 70% 28%;
            gap: 2%;
            padding: 0 20px;
        }
        /* 文章卡片 */
        .article-card {
            background: #fff;
            padding: 24px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .article-card h2 a {
            color: #222;
            text-decoration: none;
        }
        .article-card h2 a:hover {
            color: #42b983;
        }
        .article-meta {
            color: #888;
            font-size: 14px;
            margin:8px 0 12px;
        }
        .article-excerpt {
            color: #555;
            margin-bottom:12px;
        }
        .read-more {
            color:#42b983;
            text-decoration:none;
        }
        /* 侧边栏 */
        .sidebar-box {
            background: #fff;
            padding:20px;
            border-radius:8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom:20px;
        }
        .sidebar-box h3 {
            border-bottom: 2px solid #eee;
            padding-bottom:8px;
            margin-bottom:12px;
        }
        .sidebar-box ul {
            list-style: none;
        }
        .sidebar-box li a {
            color:#555;
            text-decoration:none;
            line-height:2;
        }
        .sidebar-box li a:hover {
            color:#42b983;
        }
        /* 页脚 */
        footer {
            background:#2e8b8b;
            color:#aaa;
            text-align:center;
            padding:24px;
            margin-top:40px;
        }
        /* 移动端适配 */
        @media (max-width:768px){
            .container {
                grid-template-columns: 100%;
            }
            .nav-container {
                flex-direction:column;
                gap:10px;
            }
            .nav-links {
                display:flex;
                flex-wrap:wrap;
                justify-content:center;
            }
        }
    </style>
</head>
